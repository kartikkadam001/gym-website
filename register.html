<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gym Login</title>

    <link rel="stylesheet" href="C:\Users\HP\Downloads\Gym\github\css\logincss.css">

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>MUSCLEHOUSE <span>FITNESS</span></h1>

            <h2>Welcome</h2>
            <p class="subtitle">Register to start your fitness journey</p>

            <form id="loginForm">
                                <div class="input-group">
                    <label>Name</label>
                    <input 
                        type="name" 
                        id="name" 
                        placeholder="Enter your name"
                    >
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input 
                        type="email"

                </div>

                <div class="input-group">
                    <label>New Password</label>

                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter your password"
                    >
                </div>
                                <div class="input-group">
                    <label>Re-type Password</label>

                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter your password"
                    >
                </div>
                <div class="options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    

                </div>



                <button type="submit" href="C:\Users\HP\Downloads\Gym\github\home.html">Register Now</button>

                <p id="message"></p>

            </form>

            <p class="register">
                Have account?
                <a href="C:\Users\HP\Downloads\Gym\github\login.html">Login Now</a>
            </p>

    </div>
