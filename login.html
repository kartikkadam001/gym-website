<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gym Login</title>

    <link rel="stylesheet" href="C:\Users\HP\Downloads\Gym\github\css\logincss.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>MUSCLEHOUSE <span>FITNESS</span></h1>

            <h2>Welcome Back</h2>
            <p class="subtitle">Login to continue your fitness journey</p>

            <form id="loginForm">

                <div class="input-group">
                    <label>Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="Enter your email"
                    >
                </div>

                <div class="input-group">
                    <label>Password</label>

                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter your password"
                    >
                </div>

                <div class="options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="submit"  href="C:\Users\HP\Downloads\Gym\github\home.html">LOGIN</button>
            

                <p id="message"></p>

            </form>

            <p class="register">
                Don't have an account?
                <a href="C:\Users\HP\Downloads\Gym\github\register.html">Register Now</a>
            </p>

        </div>

    </div>

    <script src="C:\Users\HP\Downloads\Gym\github\js\loginjs.js"></script>

</body>
</html>
